name: workflow-build

on:
  push:
    branches: [ main ]
  # No `paths` filter: `build` is a required check, and a workflow skipped by a
  # path filter leaves it pending forever. The `changes` job skips the jobs instead,
  # which GitHub counts as passing.
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Docs and AI configuration cannot break the build: skip the heavy jobs when only they changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.adoc'
              - '!doc/**'
              - '!docs/**'
              - '!openspec/**'
              - '!.claude/**'
              - '!.mcp.json'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  # The identification sidecar (Node, runs Cadence's recognition engine) has its own tests and image
  sidecar:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/identification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/identification/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build the image
        run: docker build -t tunelad-identification .

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # The media module decodes audio with ffmpeg to compute waveforms (and its tests need it)
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Compile and test project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: ./mvnw -B -ntp clean verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

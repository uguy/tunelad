name: workflow-pr-title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# This checks it follows Conventional Commits (rules in commitlint.config.mjs).
on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install commitlint
        run: npm install --no-save --no-package-lock --no-audit --no-fund @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

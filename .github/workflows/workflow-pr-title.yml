name: workflow-pr-title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# This checks it follows Conventional Commits (rules in commitlint.config.mjs).
on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install commitlint
        run: bun add --no-save @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no-install commitlint --verbose

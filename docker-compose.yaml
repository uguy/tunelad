services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: 'tunelad'
      POSTGRES_PASSWORD: 'tunelad'
      POSTGRES_DB: 'tunelad'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tunelad -d tunelad']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '5432:5432'

  # Hears which tunes are played in a recording, for Identification (sidecar/identification, see its README).
  # The first start downloads the tune index (about 33 MB) into the volume.
  identification:
    container_name: identification
    build: ./sidecar/identification
    volumes:
      - identification-data:/data
    ports:
      - '8090:8090'

  # Web UI for PostgreSQL: server postgres, user/password/database tunelad
  adminer:
    container_name: adminer
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8081:8080'

  # Carries live UI updates between application instances: core NATS only (no JetStream), nothing is persisted.
  nats:
    container_name: nats
    image: nats:2.11-alpine
    ports:
      - '4222:4222'

  # OpenID Connect provider for local login, standing in for Google and friends.
  # Imports the `tunelad` realm (client and test users alice/alice, bob/bob) on start: local development only.
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./docker/keycloak/:/opt/keycloak/data/import/:ro
    # The app (8080) and Adminer (8081) already use the usual ports
    ports:
      - '8180:8080'

  # Observability: the application pushes traces, metrics and logs over OTLP to the collector (localhost:4318), which
  # sends traces to Tempo, logs to Loki and metrics to Prometheus; Grafana reads all three. They talk to each other
  # by service name over the compose network: only the collector's OTLP ports and the UIs are published.
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    ports:
      - '4317:4317' # OTLP/gRPC
      - '4318:4318' # OTLP/HTTP, what the application uses

  tempo:
    image: grafana/tempo:2.10.10
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro

  loki:
    image: grafana/loki:3.7.10
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/loki.yml:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Metrics come in from the collector over OTLP instead of being scraped
      - '--web.enable-otlp-receiver'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      - tempo
      - loki
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/observability/grafana/provisioning/:/etc/grafana/provisioning/:ro
    ports:
      - '3000:3000'

volumes:
  identification-data:

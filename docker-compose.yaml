services:
  mongo:
    container_name: mongo
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'tunelad'
      MONGO_INITDB_ROOT_PASSWORD: 'tunelad'
      MONGO_INITDB_DATABASE: 'tunelad'
    # Single-node replica set, so the application can use MongoDB transactions.
    # A replica set with authentication needs a key file; a fresh one is generated on each start.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    # Initiates the replica set on first start, then reports whether it is up.
    healthcheck:
      test: >-
        mongosh --quiet -u tunelad -p tunelad --authenticationDatabase admin --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    ports:
      - '27017:27017'

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # The replica set member is registered as localhost:27017, which only resolves from the host:
      # connect directly instead of discovering the set.
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/?directConnection=true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: "tunelad"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "tunelad"
    ports:
      - '8081:8081'

  zipkin:
     image: openzipkin/zipkin
     ports:
       - 9411:9411

  prometheus:
    image: prom/prometheus:v2.42.0
    volumes:
      - ./docker/prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    # On MacOS, remove next line and replace localhost by host.docker.internal in prometheus/prometheus.yml and
    # grafana/provisioning/datasources/datasource.yml

  grafana:
    image: grafana/grafana:9.4.3
    volumes:
      - ./docker/grafana/provisioning/:/etc/grafana/provisioning/
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - 3000:3000
    # On MacOS, remove next line and replace localhost by host.docker.internal in prometheus/prometheus.yml and
    # grafana/provisioning/datasources/datasource.yml

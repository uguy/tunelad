services:
  mongo:
    container_name: mongo
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: 'tunelad'
      MONGO_INITDB_ROOT_PASSWORD: 'tunelad'
      MONGO_INITDB_DATABASE: 'tunelad'
    # Single-node replica set, so the application can use MongoDB transactions.
    # A replica set with authentication needs a key file; a fresh one is generated on each start.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
    # Initiates the replica set on first start, then reports whether it is up.
    healthcheck:
      test: >-
        mongosh --quiet -u tunelad -p tunelad --authenticationDatabase admin --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    ports:
      - '27017:27017'

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # The replica set member is registered as localhost:27017, which only resolves from the host:
      # connect directly instead of discovering the set.
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/?directConnection=true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: "tunelad"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "tunelad"
    ports:
      - '8081:8081'

  # OpenID Connect provider for local login, standing in for Google and friends.
  # Imports the `tunelad` realm (client and test users alice/alice, bob/bob) on start: local development only.
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./docker/keycloak/:/opt/keycloak/data/import/:ro
    # The app (8080) and Mongo Express (8081) already use the usual ports
    ports:
      - '8180:8080'

  # Observability: the application pushes traces, metrics and logs over OTLP to the collector (localhost:4318), which
  # sends traces to Tempo, logs to Loki and metrics to Prometheus; Grafana reads all three. They talk to each other
  # by service name over the compose network: only the collector's OTLP ports and the UIs are published.
  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    ports:
      - '4317:4317' # OTLP/gRPC
      - '4318:4318' # OTLP/HTTP, what the application uses

  tempo:
    image: grafana/tempo:2.10.10
    command: ['-config.file=/etc/tempo/tempo.yml']
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro

  loki:
    image: grafana/loki:3.7.10
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/loki.yml:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Metrics come in from the collector over OTLP instead of being scraped
      - '--web.enable-otlp-receiver'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      - tempo
      - loki
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/observability/grafana/provisioning/:/etc/grafana/provisioning/:ro
    ports:
      - '3000:3000'

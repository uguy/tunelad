# Tests never export telemetry: no collector runs for them, and every signal would otherwise log connection errors.
# Loaded next to the main application.yml, so only these keys are overridden.
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# No analysis sidecar runs for tests, and a developer's own must not be reached: uploads then fail to identify, quietly.
# The identification tests start a stub of their own.
tunelad.identification.url=http://localhost:1

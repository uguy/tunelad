openapi:
  description: Provides access to the tracks via Reactive Rest Api.
  license: Apache 2.0
  license-url: http://springdoc.org
  terms-of-service-url: http://swagger.io/terms/
  title: Spring Boot Reactive REST API test
  version: 1.0.0
info:
  app:
    description: "@project.description@"
    name: "@project.name@"
springdoc.enable-kotlin: false

spring:
  application:
    name: Tune Lad
  reactor:
    # Carries the trace context across Reactor's thread hops, so that logs written during a request have its trace id
    context-propagation: auto
  webflux:
    problemdetails:
      enabled: true
    multipart:
      # Uploaded audio files are capped at 100 MB (larger uploads answer 413); the UI checks the same limit
      max-disk-usage-per-part: 100MB
  security:
    oauth2:
      # Browser login through the local Keycloak realm (docker compose). Its configuration is read from the issuer at
      # startup, so Keycloak must be running. The secret is the dev-only one from docker/keycloak/tunelad-realm.json.
      client:
        registration:
          keycloak:
            client-name: Keycloak
            client-id: tunelad
            client-secret: tunelad-dev-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/tunelad
      # API clients authenticate with access tokens from the same realm
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/tunelad
          audiences: tunelad
          # The realm puts its realm roles in a flat "roles" claim: the "admin" role becomes ROLE_admin
          authorities-claim-name: roles
          authority-prefix: ROLE_
  web:
    resources:
      chain:
        # Enable the Spring Resource Handling chain. Disabled by default unless at least one strategy has been enabled.
        enabled: true
        compressed: true
        strategy:
          content:
            # Enable the content Version Strategy.
            enabled: true
            # Comma-separated list of patterns to apply to the Version Strategy.
            paths: /**, **/*.js,**/*.mjs, **/*.css, **/*.png
      cache:
        cachecontrol:
          max-age: 365d
  # The application reads and writes through R2DBC. The JDBC datasource only serves what has no reactive option:
  # Liquibase (at startup) and the Spring Modulith Event Publication Registry.
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/tunelad
    username: tunelad
    password: tunelad
  datasource:
    url: jdbc:postgresql://localhost:5432/tunelad
    username: tunelad
    password: tunelad
    hikari:
      maximum-pool-size: 5
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  info:
    build:
      enabled: true
    git:
      mode: full
      enabled: true
    java.enabled: true
    defaults.enabled: true
    os.enabled: true
    env.enabled: true
  endpoint:
    health.show-details: always
    env:
      access: read_only
    info:
      access: read_only
  endpoints:
    web:
      exposure:
        include: "health,info,applicationmodules,metrics"
    access:
      default: read_only
  tracing:
    sampling.probability: 1.0
  # Traces, metrics and logs all go to the OpenTelemetry Collector of the local stack (docker compose), over OTLP/HTTP
  opentelemetry:
    resource-attributes:
      service.name: "@project.artifactId@"
    tracing.export.otlp.endpoint: http://localhost:4318/v1/traces
    logging.export.otlp.endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics.export:
      url: http://localhost:4318/v1/metrics
      # The default of a minute makes dashboards wait; a development stack can afford more frequent pushes
      step: 10s
      # Seconds, the Prometheus and OpenTelemetry convention: timers are exported as *_seconds, not *_milliseconds
      base-time-unit: seconds
  metrics:
    tags:
      application: "@project.artifactId@"
    distribution:
      # Without bucket boundaries a timer has only a +Inf bucket, and histogram_quantile (the dashboards' percentiles) is NaN
      percentiles-histogram:
        http.server.requests: true

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 2KB
  http2:
    enabled: true
logging:
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
  level:
    org.springframework.modulith.observability.ModuleEntryInterceptor: TRACE
tunelad:
  live:
    nats:
      # Live UI updates travel between application instances through NATS (docker compose starts one)
      url: nats://localhost:4222

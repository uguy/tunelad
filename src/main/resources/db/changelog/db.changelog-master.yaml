# One changelog per Modulith module, each owning the tables with its prefix. No foreign key crosses a module prefix:
# modules refer to each other by id or key only.
databaseChangeLog:
  - include:
      file: db/changelog/infrastructure.sql
  - include:
      file: db/changelog/account.sql
  - include:
      file: db/changelog/track.sql
  - include:
      file: db/changelog/media.sql
  - include:
      file: db/changelog/search.sql
  - include:
      file: db/changelog/favourite.sql
  - include:
      file: db/changelog/playlist.sql
  - include:
      file: db/changelog/tune.sql

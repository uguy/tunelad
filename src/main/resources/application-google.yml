# Adds Google as a second login provider: run with the `google` profile and the credentials of an OAuth client
# created in the Google Cloud console, whose authorized redirect URI is http://localhost:8080/login/oauth2/code/google
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

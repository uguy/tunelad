<!doctype html>
<html class="no-js" lang="en" dir="ltr">
	<head>
		<title>Tune Lad</title>
		<meta
			name="description"
			content="Application name: Tunelad, music streaming, web development playground"
		/>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="images/icon-192x192.png" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.png" color="#FFFFFF" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f2f2f2" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="msapplication-TileColor" content="#FFFFFF" />
		<meta name="color-scheme" content="dark light" />
		<!-- Sets the theme before the first paint, so a dark theme never flashes light. Same rule as theme.svelte.ts -->
		<script>
			(function () {
				try {
					var choice = localStorage.getItem('tunelad.theme');
					var dark =
						choice === 'dark' ||
						(choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					var root = document.documentElement;
					root.dataset.theme = dark ? 'dark' : 'light';
					root.style.colorScheme = dark ? 'dark' : 'light';
					var color = document.querySelector('meta[name="theme-color"]');
					if (color) color.content = dark ? '#121215' : '#f2f2f2';
				} catch (e) {
					/* storage or matchMedia unavailable: the light theme stays */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--[if lt IE 9]>
			<p class="browserupgrade">
				You are using an <strong>outdated</strong> browser. Please
				<a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.
			</p>
		<![endif]-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

apiVersion: 1

# The three backends, with explicit uids so they can point at each other:
#   a trace opens its logs (Tempo -> Loki), and a log's trace id opens the trace (Loki -> Tempo).
# `$$` escapes Grafana's own variables from the environment-variable expansion done on provisioning files.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      # The logs of a trace: Loki's structured metadata carries the trace id of each record
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id=~"0*$${__trace.traceId}"'

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # A log record's trace id is structured metadata (a label of the query result): link it to its trace
      derivedFields:
        - name: Trace
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
